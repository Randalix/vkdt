param:resize:01:width:1280
param:resize:01:height:1280
# denoise sits on the raw bayer data (before demosaic/amplification), where it is most
# effective. validated recipe: aggressive but CHROMA-ONLY — luma=0 keeps luma detail + the fine
# film-like grain (luma noise reads as grain, chroma speckle does not). detail=1.0 is the default.
# edges is a colwheel float[4] = rgb chroma bias + master(.a); noise_sigma uses exp2(12*rgb+a),
# so 0:0:0:1.65 lifts the master only. strength defaults to 0.0 (= off), so it must be set here.
param:denoise:01:strength:0.8
param:denoise:01:luma:0
param:denoise:01:edges:0:0:0:1.65
# RCD (method 1) debayering instead of gaussian splats (0): less noise/artefacts.
param:demosaic:01:method:1
# raw is scene-linear with no phone saturation baked in, so the default look reads dull/flat
# (measured out-sat ~0.14 vs ~0.37 for the phone jpg path). sat 2.0 lifts chroma ~1.65x into a
# natural range without the over-saturation that 2.5 showed. brightness stays per-scene (a fixed
# exposure lift would clip the well-exposed raws), so dim shots still need a manual exposure nudge.
param:colour:01:sat:2.0
param:i-lut:filmsim:filename:data/filmsim.lut
param:i-lut:spectem:filename:data/spectra-em.lut
# auto-crop sentinel (1:3:3:7), NOT explicit full (0:1:0:1): the crop module only applies its
# rotation-aware aspect swap (get_crop_rot) for this sentinel. with an explicit full crop a raw
# whose EXIF orientation rotates it 90/270 keeps the un-rotated (landscape) output frame, so the
# rotated portrait content is pillarboxed with black side bars (preview + export).
param:crop:01:crop:1:3:3:7
param:i-raw:main:filename:placeholder.dng
