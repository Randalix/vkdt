frames:1
fps:0
# rabbit_editor M3: PNG/WebP/TIFF/BMP -> EXR on-the-fly conversion (see PNG-zu-EXR plan). Neutral
# grading path -- deliberately NO filmsim/spectral-film look (unlike m3.cfg/m3_raw.cfg): the source
# images here are typically ComfyUI renderings, not photos, so a photographic film-emulation look
# would be misplaced. The server converts the source raster image to a scene-linear EXR proxy via
# ffmpeg (zscale sRGB->linear degamma, see make_exr_proxy() in main.c) before this graph ever sees
# it; i-exr:main filename below is a portable placeholder, overridden by the server (same mechanism
# as m3.cfg's i-jpg:main / m3_raw.cfg's i-raw:main).
#   vkdt-server <docroot> <port> examples/m3_exr.cfg <image.exr>
module:i-exr:main
module:resize:01
module:crop:rot
module:crop:01
module:colour:01
module:reinhard:01
module:grade:01
module:curves:01
module:display:main
# waveform histogram branch (rabbit_editor): taps the final graded image, same as the preview.
module:hist:01
module:display:hist
connect:resize:01:output:crop:rot:input
connect:crop:rot:output:crop:01:input
connect:crop:01:output:colour:01:input
connect:colour:01:output:reinhard:01:input
connect:reinhard:01:output:grade:01:input
connect:grade:01:output:curves:01:input
connect:curves:01:output:display:main:input
connect:curves:01:output:hist:01:input
connect:hist:01:output:display:hist:input
param:i-exr:main:filename:placeholder.exr
param:resize:01:width:1280
param:resize:01:height:1280
# crop runs in TWO stages (see m3.cfg for the full rationale). crop:rot does only the EXIF-style
# orientation passthrough (rotate defaults to 1337=auto, crop sentinel 1:3:3:7 -> centred rotation-
# aware full), so the shader's rotate-about-image-centre never pushes content out of frame. crop:01
# then does the USER crop on the already-upright image with rotate:0 (no rotation), so an off-centre
# crop works like a normal crop tool.
# crop:rot is hidden from the menu by the server (name=crop, inst=rot).
param:crop:01:rotate:0
param:crop:01:crop:1:3:3:7
param:colour:01:exposure:0
param:colour:01:matrix:1
param:colour:01:white:1:1:1:1
# converted raster images are already display-referred (whatever grading/saturation the source
# PNG/WebP/etc. already baked in) and there is no filmsim stage here to inflate saturation (unlike
# m3.cfg's sat:0.85 compensation) -- so sat stays at the module's neutral default.
param:colour:01:sat:1
# i-exr:main's own output connect is placed LAST, after every param line, not grouped with the
# other connects above like m3.cfg/m3_raw.cfg do for i-jpg/i-raw -- found empirically necessary
# (phone-validation session): with it declared early (module-declaration order, like the other
# graphs), the dual-sink server export (preview + histogram, both requesting sRGB output while
# the exr proxy is linear) reproducibly renders BLACK on the very first open of a fresh image --
# not on the 2nd+ open of the SAME image once its .cfg sidecar (which the server rewrites with
# every connect line, including this one, moved to the end) exists. i-jpg/i-raw don't hit this
# because they don't have i-exr's modify_roi_out() prim/trc "unless the user already set it"
# resolution logic (main.cc), which is order-sensitive here. Root cause is in vkdt's graph/i-exr
# internals, not in this cfg or in main.c -- this reordering is the minimal, verified fix; do not
# move this connect back next to the others without re-testing a FRESH (no sidecar) image.
connect:i-exr:main:output:resize:01:input
