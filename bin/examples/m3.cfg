frames:1
fps:0
# rabbit_editor M3: spectral film simulation (filmsim) as the default look on a
# jpeg input. The server passes the image as its 4th arg and edits a downscaled
# preview proxy (full-res is only for export). resize:01 keeps the preview at
# 1280px. i-jpg:main filename is a portable placeholder, overridden by the server.
#   vkdt-server <docroot> <port> examples/m3.cfg <image.jpg>
module:i-jpg:main
module:resize:01
module:crop:rot
module:crop:01
module:colour:01
module:reinhard:01
module:grade:01
module:curves:01
module:filmsim:01
module:i-lut:filmsim
module:i-lut:spectem
module:display:main
# waveform histogram branch (rabbit_editor): taps the final graded image, same as the
# preview. the server exports display:hist as a second sink and streams it to the client.
module:hist:01
module:display:hist
connect:i-jpg:main:output:resize:01:input
connect:resize:01:output:crop:rot:input
connect:crop:rot:output:crop:01:input
connect:crop:01:output:colour:01:input
connect:colour:01:output:reinhard:01:input
connect:reinhard:01:output:grade:01:input
connect:grade:01:output:curves:01:input
connect:curves:01:output:filmsim:01:input
connect:filmsim:01:output:display:main:input
connect:filmsim:01:output:hist:01:input
connect:hist:01:output:display:hist:input
connect:i-lut:filmsim:output:filmsim:01:filmsim
connect:i-lut:spectem:output:filmsim:01:spectra
param:i-jpg:main:filename:m0_logo_0060.jpg
param:resize:01:width:1280
param:resize:01:height:1280
param:i-lut:filmsim:filename:data/filmsim.lut
param:i-lut:spectem:filename:data/spectra-em.lut
# crop runs in TWO stages. crop:rot does only the EXIF orientation (rotate defaults to 1337=auto,
# crop sentinel 1:3:3:7 -> centred rotation-aware full). because it stays centred, the shader's
# rotate-about-image-centre never pushes content out of frame. crop:01 then does the USER crop on
# the already-upright image with rotate:0 (no rotation), so an off-centre crop works like a normal
# crop tool. (a single stage broke: an off-centre user crop + rotation squared/black-barred.)
# crop:rot is hidden from the menu by the server (name=crop, inst=rot).
param:crop:01:rotate:0
param:crop:01:crop:1:3:3:7
param:colour:01:exposure:0
param:colour:01:matrix:1
param:colour:01:white:1:1:1:1
# jpg input is already display-referred (the phone baked in its own saturation); filmsim then
# inflates it (measured: out-sat > in-sat). sat 0.85 makes the pipeline ~saturation-neutral so the
# look is not over-saturated relative to the source.
param:colour:01:sat:0.85
