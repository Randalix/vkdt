frames:1
fps:0
# rabbit_editor M3: jpeg darkroom with spectral film simulation baked in as the
# default look (filmsim replaces filmcurv + local contrast). No resize/hist: the
# source jpeg determines the ROI, headless. display:main becomes the export sink.
module:i-jpg:main
module:crop:01
module:colour:01
module:filmsim:01
module:i-lut:filmsim
module:i-lut:spectem
module:display:main
connect:i-jpg:main:output:crop:01:input
connect:crop:01:output:colour:01:input
connect:colour:01:output:filmsim:01:input
connect:filmsim:01:output:display:main:input
connect:i-lut:filmsim:output:filmsim:01:filmsim
connect:i-lut:spectem:output:filmsim:01:spectra
param:i-jpg:main:filename:m0_logo_0060
param:i-lut:filmsim:filename:data/filmsim.lut
param:i-lut:spectem:filename:data/spectra-em.lut
param:colour:01:exposure:0
param:colour:01:matrix:1
param:colour:01:white:1:1:1:1
