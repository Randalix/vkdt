frames:1
fps:0
# rabbit_editor M3: spectral film simulation as the default look.
# Uses the procedural `logo` module as a reliable headless source for the
# prototype (real jpeg input via i-jpg expects an image-LIST file -- see notes;
# wiring that is a small follow-up). display:main becomes the export sink.
module:logo:main
module:crop:01
module:colour:01
module:filmsim:01
module:i-lut:filmsim
module:i-lut:spectem
module:display:main
connect:logo:main:output:crop:01:input
connect:crop:01:output:colour:01:input
connect:colour:01:output:filmsim:01:input
connect:filmsim:01:output:display:main:input
connect:i-lut:filmsim:output:filmsim:01:filmsim
connect:i-lut:spectem:output:filmsim:01:spectra
param:i-lut:filmsim:filename:data/filmsim.lut
param:i-lut:spectem:filename:data/spectra-em.lut
param:colour:01:exposure:0
param:colour:01:matrix:1
