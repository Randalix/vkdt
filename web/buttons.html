<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>rabbit_editor — buttons</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0a0a0c; color:#e6e8ea;
              font:14px/1.3 system-ui, sans-serif; -webkit-user-select:none; user-select:none;
              -webkit-tap-highlight-color:transparent; }
  #img { position:fixed; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  #hud { position:fixed; top:0; left:0; right:0; z-index:3; padding:6px 10px; pointer-events:none;
         text-align:center; color:#9fb; text-shadow:0 1px 3px #000; font-variant-numeric:tabular-nums; }
  #hud.bad { color:#e88; }

  /* slider panel: opens above the button bar when a button is pressed */
  #panel { position:fixed; left:0; right:0; bottom:64px; z-index:3;
           padding:14px 16px; background:rgba(8,9,12,.92);
           border-top:1px solid rgba(255,255,255,.08);
           transform:translateY(140%); transition:transform .16s ease; }
  #panel.open { transform:translateY(0); }
  #panel .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  #panel .name { font-size:15px; font-weight:600; }
  #panel .val  { font-size:15px; color:#6cf; font-variant-numeric:tabular-nums; }
  #panel .x    { font-size:20px; color:#889; padding:0 6px; }
  #panel input { width:100%; height:40px; touch-action:none; accent-color:#6cf; }

  /* bottom button bar */
  #bar { position:fixed; left:0; right:0; bottom:0; z-index:4; height:64px; display:flex; gap:8px;
         align-items:center; padding:0 12px calc(0px + env(safe-area-inset-bottom));
         overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
         background:rgba(6,7,9,.94); border-top:1px solid rgba(255,255,255,.08); }
  #bar::-webkit-scrollbar { display:none; }
  .btn { flex:0 0 auto; padding:9px 14px; border-radius:18px; font-size:13px; white-space:nowrap;
         background:#1b1e25; color:#cdd; border:1px solid rgba(255,255,255,.08); }
  .btn.active { background:#2b6fd0; color:#fff; border-color:#3b7fe0; }
  .btn .mod { color:#789; font-size:11px; margin-right:5px; }
</style>
</head>
<body>
<canvas id="img"></canvas>
<div id="hud">connecting…</div>
<div id="panel">
  <div class="top"><span class="name" id="pname"></span><span class="val" id="pval"></span><span class="x" id="px">✕</span></div>
  <input id="pslider" type="range">
</div>
<div id="bar"></div>
<script>
"use strict";
const imgC=document.getElementById('img'), ictx=imgC.getContext('2d',{alpha:false});
const hud=document.getElementById('hud'), bar=document.getElementById('bar');
const panel=document.getElementById('panel'), pname=document.getElementById('pname'),
      pval=document.getElementById('pval'), psl=document.getElementById('pslider'), px=document.getElementById('px');
let ws, sentAt=0, inFlight=false, queued=null, ema=0, groups=[], active=null;

function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws`); ws.binaryType='blob';
  ws.onopen=()=>{ hud.className=''; hud.textContent='tap a control'; };
  ws.onclose=()=>{ hud.className='bad'; hud.textContent='reconnecting…'; setTimeout(connect,1000); };
  ws.onerror=()=>ws.close();
  ws.onmessage=async e=>{
    if(typeof e.data==='string'){ try{ groups=JSON.parse(e.data).groups||[]; buildBar(); }catch(_){} return; }
    const rtt=performance.now()-sentAt;
    const bmp=await createImageBitmap(e.data);
    fitCanvas(imgC); ictx.imageSmoothingQuality='high'; drawContain(ictx,bmp,imgC.width,imgC.height); bmp.close();
    ema=ema?ema*0.8+rtt*0.2:rtt;
    if(!active) hud.textContent=`${rtt.toFixed(0)} ms · tap a control`;
    inFlight=false; if(queued!==null){ const q=queued; queued=null; sendParam(q.g,q.p,q.v); }
  };
}
function sendParam(gi,pi,v){
  const it=groups[gi].items[pi]; it.cur=v;
  if(active&&active.gi===gi&&active.pi===pi) pval.textContent=v.toFixed(3);
  if(!ws||ws.readyState!==1) return;
  if(inFlight){ queued={g:gi,p:pi,v}; return; }
  inFlight=true; sentAt=performance.now(); ws.send(`P ${groups[gi].modid} ${it.parid} ${v}`);
}
function fitCanvas(c){ const d=devicePixelRatio||1,w=innerWidth*d|0,h=innerHeight*d|0; if(c.width!==w||c.height!==h){c.width=w;c.height=h;} }
function drawContain(ctx,bmp,W,H){ const s=Math.min(W/bmp.width,H/bmp.height),w=bmp.width*s,h=bmp.height*s;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.drawImage(bmp,(W-w)/2,(H-h)/2,w,h); }

// row of buttons, one per param (grouped label)
function buildBar(){
  bar.innerHTML='';
  groups.forEach((g,gi)=> g.items.forEach((it,pi)=>{
    const b=document.createElement('div'); b.className='btn';
    b.innerHTML=`<span class="mod">${g.label}</span>${it.label}`;
    b.addEventListener('click',()=>openSlider(gi,pi,b));
    bar.append(b);
  }));
}
function openSlider(gi,pi,btn){
  document.querySelectorAll('.btn.active').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const it=groups[gi].items[pi]; active={gi,pi};
  pname.textContent=`${groups[gi].label} · ${it.label}`;
  psl.min=it.min; psl.max=it.max; psl.step=(it.max-it.min)/1000||0.001; psl.value=it.cur;
  pval.textContent=(+it.cur).toFixed(3);
  panel.classList.add('open');
}
function closeSlider(){ panel.classList.remove('open'); active=null;
  document.querySelectorAll('.btn.active').forEach(b=>b.classList.remove('active')); hud.textContent='tap a control'; }
psl.addEventListener('input',()=>{ if(active) sendParam(active.gi,active.pi,+psl.value); });
px.addEventListener('click',closeSlider);

connect();
</script>
</body>
</html>
