<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>rabbit_editor</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0a0a0c; color:#e6e8ea;
              font:14px/1.3 system-ui, sans-serif; -webkit-user-select:none; user-select:none;
              -webkit-tap-highlight-color:transparent; }
  #img, #menu { position:fixed; inset:0; width:100%; height:100%; }
  #img  { object-fit:contain; background:#000; }
  /* idle: pan-x pan-y lets the browser keep the edge-swipe-back gesture (and disables
     browser pinch-zoom so our 2-finger zoom stays ours). JS sets 'none' while a tool
     is active so drags control the tool instead of navigating back. */
  #menu { touch-action:pan-x pan-y; z-index:1; }
  #hud  { position:fixed; left:0; right:0; top:0; z-index:3; padding:6px 10px; pointer-events:none;
          font-variant-numeric:tabular-nums; color:#9fb; text-align:center; text-shadow:0 1px 3px #000; }
  #hud.bad { color:#e88; }
  /* bottom button row — coexists with the radial (hold on the image) */
  #bar { position:fixed; left:0; right:0; bottom:0; z-index:4; display:flex; gap:8px; align-items:center;
         height:60px; padding:0 12px calc(0px + env(safe-area-inset-bottom));
         overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
         background:rgba(6,7,9,.92); border-top:1px solid rgba(255,255,255,.08); }
  #bar::-webkit-scrollbar { display:none; }
  .btn { flex:0 0 auto; padding:9px 14px; border-radius:18px; font-size:13px; white-space:nowrap;
         background:#1b1e25; color:#cdd; border:1px solid rgba(255,255,255,.08); }
  .btn.active { background:#2b6fd0; color:#fff; border-color:#3b7fe0; }
  .btn .mod { color:#789; font-size:11px; margin-right:5px; }
</style>
</head>
<body>
<canvas id="img"></canvas>
<canvas id="menu"></canvas>
<div id="hud">connecting…</div>
<div id="bar"></div>
<script>
"use strict";
const imgC=document.getElementById('img'), ictx=imgC.getContext('2d',{alpha:false});
const ovr=document.getElementById('menu'), octx=ovr.getContext('2d');
const hud=document.getElementById('hud'), bar=document.getElementById('bar');
let ws, sentAt=0, inFlight=false, pending=null, ema=0, groups=[];

// ---- websocket ----
function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws`); ws.binaryType='blob';
  ws.onopen=()=>{ hud.className=''; hud.textContent='press & hold image to edit · or tap a control below'; };
  ws.onclose=()=>{ hud.className='bad'; hud.textContent='reconnecting…'; setTimeout(connect,1000); };
  ws.onerror=()=>ws.close();
  ws.onmessage=async e=>{
    if(typeof e.data==='string'){ try{ groups=JSON.parse(e.data).groups||[]; buildBar(); }catch(_){} return; }
    const rtt=performance.now()-sentAt;
    const bmp=await createImageBitmap(e.data);
    if(lastBmp) lastBmp.close(); lastBmp=bmp; drawView();   // keep current zoom/pan across frames
    ema=ema?ema*0.8+rtt*0.2:rtt;
    if(state===ST.IDLE) hud.textContent=`${rtt.toFixed(0)} ms · hold or tap`;
    inFlight=false; if(pending){ const fn=pending; pending=null; inFlight=true; sentAt=performance.now(); fn(); }
  };
}
// one render in flight; keep only the latest pending send
function rawSend(fn){ if(!ws||ws.readyState!==1) return;
  if(inFlight){ pending=fn; return; } inFlight=true; sentAt=performance.now(); fn(); }
function sendParam(gi,pi,v){ const it=groups[gi].items[pi]; it.cur=v;
  rawSend(()=>ws.send(`P ${groups[gi].modid} ${it.parid} ${v}`)); }
function sendVec(gi,pi){ const it=groups[gi].items[pi];
  rawSend(()=>ws.send(`V ${groups[gi].modid} ${it.parid} ${it.cur.join(' ')}`)); }
function fitCanvas(c){ const d=devicePixelRatio||1,w=innerWidth*d|0,h=innerHeight*d|0; if(c.width!==w||c.height!==h){c.width=w;c.height=h;} }
// view = zoom/pan over the received preview bitmap (tx/ty in CSS px, scale>=1)
let lastBmp=null, view={scale:1, tx:0, ty:0};
function drawView(){
  if(!lastBmp) return;
  fitCanvas(imgC);
  const d=devicePixelRatio||1, W=imgC.width, H=imgC.height;
  const base=Math.min(W/lastBmp.width, H/lastBmp.height)*view.scale, w=lastBmp.width*base, h=lastBmp.height*base;
  ictx.setTransform(1,0,0,1,0,0); ictx.fillStyle='#000'; ictx.fillRect(0,0,W,H);
  ictx.imageSmoothingQuality='high';
  ictx.drawImage(lastBmp, (W-w)/2 + view.tx*d, (H-h)/2 + view.ty*d, w, h);
}

// ---- bottom button bar ----
function buildBar(){
  bar.innerHTML='';
  groups.forEach((g,gi)=> g.items.forEach((it,pi)=>{
    const b=document.createElement('div'); b.className='btn'; b.dataset.gi=gi; b.dataset.pi=pi;
    b.innerHTML=`<span class="mod">${g.label}</span>${it.label}`;
    b.addEventListener('click',()=>enterValue(gi,pi));
    bar.append(b);
  }));
}
function markActive(gi,pi){
  document.querySelectorAll('.btn.active').forEach(b=>b.classList.remove('active'));
  if(gi>=0){ const b=bar.querySelector(`.btn[data-gi="${gi}"][data-pi="${pi}"]`); if(b) b.classList.add('active'); }
}
// bar sorts by usage: most-recently-used button moves to the front
let usage=[];
function bumpUsage(gi,pi){ const k=gi+'-'+pi; usage=usage.filter(x=>x!==k); usage.unshift(k); reorderBar(); }
function reorderBar(){
  for(let i=usage.length-1;i>=0;i--){ const [g,p]=usage[i].split('-');
    const b=bar.querySelector(`.btn[data-gi="${g}"][data-pi="${p}"]`); if(b) bar.prepend(b); }
  bar.scrollTo({left:0, behavior:'smooth'});
}

// ---- shared value scrub (drag anywhere — no need to hit a slider) ----
const ST={ IDLE:0, GROUPS:1, PARAMS:2, VALUE:3, WHEEL:4, CROP:5 };
let state=ST.IDLE, cx=0, cy=0, curGroup=-1, hover=-1;
let valStartX=0, valBase=0, valItem=null, valGI=-1, valPI=-1, scrubbing=false;
const R =()=>Math.min(innerWidth,innerHeight)*0.34, R0=()=>R()*0.4;
const RT32=0.8660254, INV_RT3=0.5773503, CH_SENS=0.4;  // colour-wheel mapping (matches vkdt); low sensitivity

// ---- colour wheel (2D chroma trackball + master), mirrors vkdt's colwheel ----
let whItem=null, whGI=-1, whPI=-1, whDrag=null, whLX=0, whLY=0, whMoved=false;
const WCX=()=>innerWidth/2, WCY=()=>innerHeight*0.40, WR=()=>Math.min(innerWidth,innerHeight)*0.28;
function enterWheel(gi,pi){ whGI=gi; whPI=pi; whItem=groups[gi].items[pi];
  if(!Array.isArray(whItem.cur)) whItem.cur=[...(whItem.def||[0,0,0,0])];
  whDrag=null; state=ST.WHEEL; markActive(gi,pi); drawOverlay();
  hud.textContent=`${whItem.label} — drag anywhere = colour · bar = master · tap = close`; }
function wheelChroma(dx,dy){ const it=whItem, def=it.def, cur=it.cur;
  const sx=dx/(WR()*2)*CH_SENS, sy=dy/(WR()*2)*CH_SENS;
  let disp=[cur[0]-def[0], cur[1]-def[1], cur[2]-def[2]];
  disp[0]+=-2/3*sy; disp[1]+=1/3*sy-INV_RT3*sx; disp[2]+=1/3*sy+INV_RT3*sx;
  const wx=disp[2]-disp[1], wy=(-disp[0]+0.5*(disp[1]+disp[2]))/RT32, dd=wx*wx+wy*wy;
  if(dd>1){ const s=1/Math.sqrt(dd); disp=disp.map(x=>x*s); }
  cur[0]=def[0]+disp[0]; cur[1]=def[1]+disp[1]; cur[2]=def[2]+disp[2]; sendVec(whGI,whPI); }
function wheelMaster(dx){ const it=whItem, range=it.max-it.min;
  it.cur[3]=Math.max(it.min, Math.min(it.max, it.cur[3]+(dx/(innerWidth*0.8))*range)); sendVec(whGI,whPI); }

function enterValue(gi,pi){ const it=groups[gi].items[pi];
  if(it.kind==='wheel'){ enterWheel(gi,pi); return; }
  if(it.kind==='crop'){ enterCrop(gi,pi); return; }
  valGI=gi; valPI=pi; valItem=it; state=ST.VALUE; scrubbing=false;
  markActive(gi,pi); drawOverlay(); hud.textContent=`${it.label} — drag anywhere`; }

// ---- crop tool: rectangle handles on the (uncropped) image ----
let cropItem=null, crGI=-1, crPI=-1, cr=[0,1,0,1], crHandle=null, crLX=0, crLY=0;
function sendCropVec(gi,pi,a){ rawSend(()=>ws.send(`V ${groups[gi].modid} ${groups[gi].items[pi].parid} ${a.join(' ')}`)); }
function imgRect(){ if(!lastBmp) return {ix:0,iy:0,iw:innerWidth,ih:innerHeight};
  const base=Math.min(innerWidth/lastBmp.width, innerHeight/lastBmp.height)*view.scale;
  const iw=lastBmp.width*base, ih=lastBmp.height*base;
  return {ix:(innerWidth-iw)/2+view.tx, iy:(innerHeight-ih)/2+view.ty, iw, ih}; }
function enterCrop(gi,pi){ crGI=gi; crPI=pi; cropItem=groups[gi].items[pi];
  const c=cropItem.cur;
  cr = (Array.isArray(c)&&c[1]<=1.001&&c[3]<=1.001&&c[1]>c[0]&&c[3]>c[2])
       ? [Math.max(0,c[0]),Math.min(1,c[1]),Math.max(0,c[2]),Math.min(1,c[3])] : [0,1,0,1];
  crHandle=null; state=ST.CROP; markActive(gi,pi);
  sendCropVec(gi,pi,[0,1,0,1]);            // show the full uncropped image while editing
  drawOverlay(); hud.textContent='crop — drag corners/edges · tap = apply'; }
function cropHandleAt(x,y){ const r=imgRect(), th=30;
  const L=r.ix+cr[0]*r.iw, R=r.ix+cr[1]*r.iw, T=r.iy+cr[2]*r.ih, B=r.iy+cr[3]*r.ih, near=(a,b)=>Math.abs(a-b)<=th;
  const nx=near(x,L)?'l':near(x,R)?'r':'', ny=near(y,T)?'t':near(y,B)?'b':'';
  if(nx&&ny) return ny+nx;                       // corner e.g. 'tl'
  if(nx && y>T-th && y<B+th) return nx;          // vertical edge
  if(ny && x>L-th && x<R+th) return ny;          // horizontal edge
  if(x>L&&x<R&&y>T&&y<B) return 'move';
  return null; }
function cropDrag(x,y,dx,dy){ const r=imgRect(), MIN=0.05, h=crHandle;
  const fx=v=>Math.max(0,Math.min(1,(v-r.ix)/r.iw)), fy=v=>Math.max(0,Math.min(1,(v-r.iy)/r.ih));
  if(h==='move'){ let ddx=Math.max(-cr[0],Math.min(1-cr[1],dx/r.iw)), ddy=Math.max(-cr[2],Math.min(1-cr[3],dy/r.ih));
    cr[0]+=ddx; cr[1]+=ddx; cr[2]+=ddy; cr[3]+=ddy; return; }
  if(h.includes('l')) cr[0]=Math.min(fx(x), cr[1]-MIN);
  if(h.includes('r')) cr[1]=Math.max(fx(x), cr[0]+MIN);
  if(h.includes('t')) cr[2]=Math.min(fy(y), cr[3]-MIN);
  if(h.includes('b')) cr[3]=Math.max(fy(y), cr[2]+MIN); }

function ringItems(){ if(state===ST.GROUPS) return groups.map(g=>g.label);
  if(state===ST.PARAMS) return groups[curGroup].items.map(it=>it.label); return []; }
function pick(x,y){ const dx=x-cx,dy=y-cy,n=ringItems().length;
  if(!n||dx*dx+dy*dy<R0()*R0()) return -1;
  return Math.min(n-1, Math.floor((Math.atan2(dy,dx)+Math.PI)/(2*Math.PI/n))); }

// override the browser's edge-swipe-back ONLY while a tool/menu/pinch is active
function applyTouchAction(){ const cap = (state!==ST.IDLE || blockRadial || pointers.size>=2);
  ovr.style.touchAction = cap ? 'none' : 'pan-x pan-y';
  // also block Chrome's own overscroll history-nav while a tool is active (idle keeps it)
  document.documentElement.style.overscrollBehaviorX = cap ? 'none' : ''; }
function drawOverlay(){
  applyTouchAction();
  fitCanvas(ovr); const d=devicePixelRatio||1; octx.setTransform(d,0,0,d,0,0);
  octx.clearRect(0,0,innerWidth,innerHeight);
  if(state===ST.IDLE) return;
  if(state===ST.CROP){
    const r=imgRect(), L=r.ix+cr[0]*r.iw, R=r.ix+cr[1]*r.iw, T=r.iy+cr[2]*r.ih, B=r.iy+cr[3]*r.ih;
    octx.strokeStyle='rgba(255,255,255,.9)'; octx.lineWidth=2; octx.strokeRect(L,T,R-L,B-T);
    octx.strokeStyle='rgba(255,255,255,.25)'; octx.lineWidth=1; octx.beginPath();
    for(let k=1;k<3;k++){ const gx=L+(R-L)*k/3, gy=T+(B-T)*k/3;
      octx.moveTo(gx,T); octx.lineTo(gx,B); octx.moveTo(L,gy); octx.lineTo(R,gy); } octx.stroke();
    octx.strokeStyle='#fff'; octx.lineWidth=4; const tk=18;
    const corner=(x,y,sx,sy)=>{ octx.beginPath(); octx.moveTo(x+sx*tk,y); octx.lineTo(x,y); octx.lineTo(x,y+sy*tk); octx.stroke(); };
    corner(L,T,1,1); corner(R,T,-1,1); corner(L,B,1,-1); corner(R,B,-1,-1);
    return;
  }
  if(state===ST.WHEEL){
    const it=whItem, ccx=WCX(), ccy=WCY(), r=WR(), def=it.def, cur=it.cur;
    const rIn=r*0.88;  // thin ring only — never fill the centre, image stays visible
    for(let i=0;i<48;i++){ const a0=2*Math.PI*i/48, a1=2*Math.PI*(i+1)/48+0.012, h=-(a0+a1)/2-Math.PI/2;
      octx.beginPath(); octx.arc(ccx,ccy,r,a0,a1); octx.arc(ccx,ccy,rIn,a1,a0,true); octx.closePath();
      octx.fillStyle=`rgb(${(0.5+0.5*Math.cos(h))*255|0},${(0.5+0.5*Math.cos(h-2.0944))*255|0},${(0.5+0.5*Math.cos(h+2.0944))*255|0})`;
      octx.fill(); }
    const disp=[cur[0]-def[0],cur[1]-def[1],cur[2]-def[2]];
    const wx=disp[2]-disp[1], wy=(-disp[0]+0.5*(disp[1]+disp[2]))/RT32, px=ccx+wx*r, py=ccy+wy*r;
    octx.strokeStyle='rgba(150,150,150,.5)'; octx.lineWidth=1;
    octx.beginPath(); octx.moveTo(ccx-8,ccy); octx.lineTo(ccx+8,ccy); octx.moveTo(ccx,ccy-8); octx.lineTo(ccx,ccy+8); octx.stroke();
    octx.beginPath(); octx.arc(px,py,9,0,7); octx.fillStyle='#fff'; octx.fill(); octx.strokeStyle='#000'; octx.lineWidth=2; octx.stroke();
    const my=ccy+r+26, mw=r*1.6, mx=ccx-mw/2, frac=Math.max(0,Math.min(1,(cur[3]-it.min)/(it.max-it.min)));
    octx.strokeStyle='rgba(255,255,255,.3)'; octx.lineWidth=4; octx.lineCap='round';
    octx.beginPath(); octx.moveTo(mx,my); octx.lineTo(mx+mw,my); octx.stroke();
    octx.strokeStyle='#bbb'; octx.beginPath(); octx.moveTo(mx,my); octx.lineTo(mx+mw*frac,my); octx.stroke();
    octx.fillStyle='#fff'; octx.textAlign='center'; octx.textBaseline='alphabetic'; octx.shadowColor='#000'; octx.shadowBlur=4;
    octx.font='600 18px system-ui'; octx.fillText(it.label, ccx, ccy-r-14);
    octx.font='12px system-ui'; octx.fillStyle='#cde'; octx.fillText('drag anywhere · bar = master · tap to close', ccx, my+26);
    octx.shadowBlur=0; return;
  }
  if(state===ST.VALUE){
    const it=valItem, frac=Math.max(0,Math.min(1,(it.cur-it.min)/(it.max-it.min)));
    const y=innerHeight*0.40, m=40, w=innerWidth-2*m;
    octx.strokeStyle='rgba(255,255,255,.35)'; octx.lineWidth=4; octx.lineCap='round';
    octx.beginPath(); octx.moveTo(m,y); octx.lineTo(m+w,y); octx.stroke();
    octx.strokeStyle='#6cf'; octx.beginPath(); octx.moveTo(m,y); octx.lineTo(m+w*frac,y); octx.stroke();
    octx.fillStyle='#6cf'; octx.beginPath(); octx.arc(m+w*frac,y,12,0,7); octx.fill();
    octx.fillStyle='#fff'; octx.textAlign='center'; octx.font='600 20px system-ui'; octx.shadowColor='#000'; octx.shadowBlur=4;
    octx.fillText(`${it.label}   ${it.cur.toFixed(3)}`, innerWidth/2, y-28);
    octx.font='13px system-ui'; octx.fillStyle='#cde'; octx.fillText('drag = adjust · tap = accept & close', innerWidth/2, y+34);
    octx.shadowBlur=0; return;
  }
  const items=ringItems(), n=items.length, r=R(), seg=2*Math.PI/n;
  for(let i=0;i<n;i++){
    const a0=i*seg-Math.PI, a1=a0+seg, mid=a0+seg/2;
    octx.beginPath(); octx.moveTo(cx+Math.cos(a0)*R0(), cy+Math.sin(a0)*R0());
    octx.arc(cx,cy,r,a0,a1); octx.arc(cx,cy,R0(),a1,a0,true); octx.closePath();
    octx.fillStyle=(i===hover)?'rgba(80,150,230,.85)':'rgba(18,20,26,.45)'; octx.fill();
    octx.strokeStyle='rgba(255,255,255,.14)'; octx.lineWidth=1; octx.stroke();
    octx.fillStyle=(i===hover)?'#fff':'#cdd'; octx.textAlign='center'; octx.textBaseline='middle';
    octx.font=(i===hover?'600 ':'')+'13px system-ui';
    octx.fillText(items[i], cx+Math.cos(mid)*r*0.72, cy+Math.sin(mid)*r*0.72);
  }
  octx.fillStyle='#9ab'; octx.textAlign='center'; octx.textBaseline='middle'; octx.font='12px system-ui';
  octx.fillText(state===ST.GROUPS?'module':groups[curGroup].label, cx, cy);
}
const pos=e=>({x:e.clientX,y:e.clientY});

// ---- pinch zoom / 2-finger pan — kept strictly separate from the radial ----
const pointers=new Map();
let pinch=null, blockRadial=false;
function startPinch(){ const v=[...pointers.values()],a=v[0],b=v[1]; if(!a||!b) return;
  pinch={ d:Math.hypot(a.x-b.x,a.y-b.y)||1, mx:(a.x+b.x)/2, my:(a.y+b.y)/2, view:{...view} }; }
function updatePinch(){ const v=[...pointers.values()],a=v[0],b=v[1]; if(!a||!b||!pinch||!lastBmp) return;
  const d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  const ns=Math.max(1, Math.min(8, pinch.view.scale*(d/pinch.d)));
  const base=Math.min(innerWidth/lastBmp.width, innerHeight/lastBmp.height);
  const sS=base*pinch.view.scale, nS=base*ns;
  const c0x=(pinch.mx-(innerWidth/2+pinch.view.tx))/sS, c0y=(pinch.my-(innerHeight/2+pinch.view.ty))/sS;
  view.scale=ns; view.tx=mx-innerWidth/2-c0x*nS; view.ty=my-innerHeight/2-c0y*nS;
  if(ns<=1.001){ view.tx=0; view.ty=0; }   // snap back to fit
  drawView();
}

// ---- gesture model: tap = accept&close · drag = adjust · long-press = open radial ----
const HOLD_MS=260, MOVE_TH=10;
let holdTimer=null, pressArmed=false, downX=0, downY=0, moved=false, justOpened=false;
function clampRing(x,y){ const m=R()*1.06+18, bar=64;   // keep the whole ring on-screen
  return { x:Math.max(m, Math.min(innerWidth-m, x)), y:Math.max(m, Math.min(innerHeight-bar-m, y)) }; }
function openRadial(x,y){ const c=clampRing(x,y); cx=c.x; cy=c.y; state=ST.GROUPS; curGroup=-1; hover=-1;
  justOpened=true; if(navigator.vibrate) navigator.vibrate(8); hud.textContent='drag to a module'; drawOverlay(); }
function cancelHold(){ pressArmed=false; clearTimeout(holdTimer); holdTimer=null; }

// immersive: go fullscreen on first touch (and recover if the user leaves it).
// in fullscreen Android gates the system edge-back gesture, so tool drags from the
// edge are not stolen by the OS back navigation. needs a user gesture -> pointerdown.
function tryFullscreen(){ if(document.fullscreenElement) return;
  const el=document.documentElement, fn=el.requestFullscreen||el.webkitRequestFullscreen;
  if(fn){ try{ const r=fn.call(el); if(r&&r.catch) r.catch(()=>{}); }catch(_){} } }

ovr.addEventListener('pointerdown', e=>{
  tryFullscreen();
  ovr.setPointerCapture(e.pointerId); pointers.set(e.pointerId, pos(e));
  if(pointers.size>=2){ blockRadial=true; cancelHold(); state=ST.IDLE; whDrag=null; scrubbing=false; markActive(-1); drawOverlay(); startPinch(); return; }
  if(blockRadial) return;
  const p=pos(e); downX=p.x; downY=p.y; moved=false;
  if(state===ST.WHEEL){
    const my=WCY()+WR()+26, mw=WR()*1.6, mx=WCX()-mw/2;
    whDrag=(p.x>=mx-14 && p.x<=mx+mw+14 && Math.abs(p.y-my)<28)?'master':'chroma'; whLX=p.x; whLY=p.y;
  }
  else if(state===ST.CROP){ crHandle=cropHandleAt(p.x,p.y); crLX=p.x; crLY=p.y; }
  else if(state===ST.VALUE){ valStartX=p.x; valBase=valItem.cur; scrubbing=true; }
  else if(state===ST.GROUPS||state===ST.PARAMS){ hover=pick(p.x,p.y); drawOverlay(); }
  else { pressArmed=true; clearTimeout(holdTimer);   // IDLE: arm long-press to open radial
    holdTimer=setTimeout(()=>{ if(pressArmed && pointers.size===1) openRadial(downX,downY); }, HOLD_MS); }
});
ovr.addEventListener('pointermove', e=>{
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId, pos(e));
  if(pointers.size>=2){ updatePinch(); return; }
  if(blockRadial) return;
  const p=pos(e); if(Math.hypot(p.x-downX,p.y-downY)>MOVE_TH) moved=true;
  if(state===ST.IDLE){ if(pressArmed && moved) cancelHold(); return; }  // moved before hold = swipe, no radial
  if(state===ST.CROP){ if(crHandle){ cropDrag(p.x,p.y, p.x-crLX, p.y-crLY); crLX=p.x; crLY=p.y; drawOverlay(); } return; }
  if(state===ST.WHEEL){ if(whDrag){ const dx=p.x-whLX, dy=p.y-whLY; whLX=p.x; whLY=p.y;
      if(whDrag==='chroma') wheelChroma(dx,dy); else wheelMaster(dx); drawOverlay(); } return; }
  if(state===ST.VALUE){ if(scrubbing){ const range=valItem.max-valItem.min;
      let val=valBase+((p.x-valStartX)/(innerWidth*0.8))*range;
      val=Math.max(valItem.min,Math.min(valItem.max,val)); sendParam(valGI,valPI,val); drawOverlay(); } return; }
  hover=pick(p.x,p.y); drawOverlay();   // GROUPS / PARAMS
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size>=2){ startPinch(); applyTouchAction(); return; }
  if(pointers.size===1){ pinch=null; applyTouchAction(); return; }
  if(blockRadial){ blockRadial=false; pinch=null; applyTouchAction(); return; }
  const p=pos(e), tap=!moved;
  if(state===ST.IDLE){ cancelHold(); return; }   // short tap in idle → nothing (radial opens on hold)
  if(state===ST.CROP){
    if(tap){ sendCropVec(crGI,crPI,cr); state=ST.IDLE; crHandle=null; markActive(-1); hud.textContent='hold or tap'; } // apply & close
    else crHandle=null;                                                                                               // handle drag → keep editing
    drawOverlay(); return; }
  if(state===ST.GROUPS){ const sel=pick(p.x,p.y);
    if(sel>=0){ curGroup=sel; const c=clampRing(p.x,p.y); cx=c.x; cy=c.y; state=ST.PARAMS; hover=-1; hud.textContent='drag to a parameter'; }
    else if(!justOpened) { state=ST.IDLE; hud.textContent='hold or tap'; }
    justOpened=false; drawOverlay(); return; }
  if(state===ST.PARAMS){ const sel=pick(p.x,p.y);
    if(sel>=0) enterValue(curGroup,sel); else { state=ST.IDLE; hud.textContent='hold or tap'; }
    drawOverlay(); return; }
  if(state===ST.VALUE){ scrubbing=false; bumpUsage(valGI,valPI);
    if(tap){ state=ST.IDLE; markActive(-1); hud.textContent='hold or tap'; }   // tap = accept & close
    drawOverlay(); return; }                                                   // drag = keep tool open
  if(state===ST.WHEEL){
    if(tap){ whDrag=null; state=ST.IDLE; markActive(-1); hud.textContent='hold or tap'; }  // tap = accept & close
    else { bumpUsage(whGI,whPI); whDrag=null; }                                            // drag = keep wheel open
    drawOverlay(); return; }
}
ovr.addEventListener('pointerup', endPointer);
ovr.addEventListener('pointercancel', e=>{ cancelHold(); endPointer(e); });

addEventListener('resize', ()=>{ drawView(); if(state!==ST.IDLE) drawOverlay(); });
connect();
</script>
